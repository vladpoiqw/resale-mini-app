<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resale Profit</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 18px;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background: var(--tg-theme-bg-color, #0f0f10);
            color: var(--tg-theme-text-color, #ffffff);
        }

        .header {
            margin-top: 8px;
            margin-bottom: 24px;
        }

        .logo {
            font-size: 13px;
            letter-spacing: 1px;
            opacity: 0.45;
            margin-bottom: 8px;
        }

        h1 {
            margin: 0;
            font-size: 30px;
        }

        .subtitle {
            margin-top: 8px;
            font-size: 14px;
            opacity: 0.55;
        }

        .card,
        .result {
            background: var(--tg-theme-secondary-bg-color, #19191b);
            border-radius: 22px;
            padding: 20px;
        }

        .field {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            opacity: 0.55;
        }

        input {
            width: 100%;
            height: 52px;
            padding: 0 15px;

            border: none;
            outline: none;
            border-radius: 14px;

            background: var(--tg-theme-bg-color, #101011);
            color: var(--tg-theme-text-color, #ffffff);

            font-size: 17px;
        }

        button {
            width: 100%;
            height: 54px;

            border: none;
            border-radius: 15px;

            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);

            font-size: 16px;
            font-weight: 600;
        }

        .save-button {
            margin-top: 10px;
            background: transparent;
            border: 1px solid rgba(128,128,128,0.35);
        }

        .result {
            display: none;
            margin-top: 18px;
        }

        .result-title {
            font-size: 13px;
            opacity: 0.5;
            margin-bottom: 6px;
        }

        .profit {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 18px;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat {
            padding: 14px;
            border-radius: 15px;
            background: var(--tg-theme-bg-color, #101011);
        }

        .stat-name {
            font-size: 12px;
            opacity: 0.5;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 600;
        }

        .message {
            text-align: center;
            margin-top: 12px;
            font-size: 13px;
            opacity: 0.6;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 11px;
            opacity: 0.3;
        }

    </style>

</head>


<body>


<div class="header">

    <div class="logo">
        RESALE TOOLS
    </div>

    <h1>
        Прибыль
    </h1>

    <div class="subtitle" id="subtitle">
        Рассчитай доходность сделки
    </div>

</div>


<div class="card">


    <div class="field">

        <label>
            Цена покупки
        </label>

        <input
            id="buy"
            type="number"
            inputmode="decimal"
            placeholder="0 ₽"
        >

    </div>


    <div class="field">

        <label>
            Цена продажи
        </label>

        <input
            id="sell"
            type="number"
            inputmode="decimal"
            placeholder="0 ₽"
        >

    </div>


    <div class="field">

        <label>
            Комиссия и расходы
        </label>

        <input
            id="expenses"
            type="number"
            inputmode="decimal"
            placeholder="0 ₽"
        >

    </div>


    <button onclick="calculate()">
        Рассчитать
    </button>

</div>


<div class="result" id="result">

    <div class="result-title">
        Чистая прибыль
    </div>

    <div class="profit" id="profit">
        0 ₽
    </div>


    <div class="stats">

        <div class="stat">

            <div class="stat-name">
                Маржа
            </div>

            <div class="stat-value" id="margin">
                0%
            </div>

        </div>


        <div class="stat">

            <div class="stat-name">
                ROI
            </div>

            <div class="stat-value" id="roi">
                0%
            </div>

        </div>

    </div>


    <button
        class="save-button"
        onclick="saveDeal()"
    >
        💾 Сохранить сделку
    </button>

</div>


<div
    class="message"
    id="message"
></div>


<div class="footer">
    Resale Profit · v1.0
</div>



<script>


    // ==============================
    // SUPABASE
    // ==============================

    const SUPABASE_URL =
        "msqszglpcbutxeciaoma";

    const SUPABASE_KEY =
        "sb_publishable_khm1gzHsh9AihyYrA7k63w_CiBsNc0B";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );



    // ==============================
    // TELEGRAM
    // ==============================

    const tg =
        window.Telegram.WebApp;

    tg.ready();

    tg.expand();


    const user =
        tg.initDataUnsafe?.user;


    if (user) {

        document.getElementById(
            "subtitle"
        ).innerText =
            "Привет, " +
            user.first_name +
            "!";

    }



    // ==============================
    // ТЕКУЩАЯ СДЕЛКА
    // ==============================

    let currentDeal = null;



    // ==============================
    // РАСЧЁТ
    // ==============================

    function calculate() {


        const buy =
            Number(
                document.getElementById(
                    "buy"
                ).value
            );


        const sell =
            Number(
                document.getElementById(
                    "sell"
                ).value
            );


        const expenses =
            Number(
                document.getElementById(
                    "expenses"
                ).value
            ) || 0;



        if (
            buy <= 0 ||
            sell <= 0
        ) {

            alert(
                "Укажи цену покупки и продажи"
            );

            return;

        }



        const profit =
            sell -
            buy -
            expenses;


        const margin =
            (profit / sell) * 100;


        const roi =
            (profit / buy) * 100;



        currentDeal = {

            buy_price: buy,

            sell_price: sell,

            expenses: expenses,

            profit: profit

        };



        document.getElementById(
            "profit"
        ).innerText =
            formatMoney(profit);



        document.getElementById(
            "margin"
        ).innerText =
            margin.toFixed(1) + "%";



        document.getElementById(
            "roi"
        ).innerText =
            roi.toFixed(1) + "%";



        document.getElementById(
            "result"
        ).style.display =
            "block";


        document.getElementById(
            "message"
        ).innerText = "";

    }



    // ==============================
    // СОХРАНЕНИЕ
    // ==============================

    async function saveDeal() {


        if (!currentDeal) {

            alert(
                "Сначала рассчитай сделку"
            );

            return;

        }


        if (!user) {

            alert(
                "Не удалось определить пользователя Telegram"
            );

            return;

        }



        const deal = {

            user_id:
                String(user.id),

            buy_price:
                currentDeal.buy_price,

            sell_price:
                currentDeal.sell_price,

            expenses:
                currentDeal.expenses,

            profit:
                currentDeal.profit

        };



        const {
            error
        } = await supabaseClient
            .from("deals")
            .insert(deal);



        if (error) {

            console.error(error);

            document.getElementById(
                "message"
            ).innerText =
                "Ошибка сохранения: " +
                error.message;

            return;

        }



        document.getElementById(
            "message"
        ).innerText =
            "✅ Сделка сохранена";


    }



    // ==============================
    // ФОРМАТ ДЕНЕГ
    // ==============================

    function formatMoney(number) {

        return new Intl.NumberFormat(
            "ru-RU",
            {
                maximumFractionDigits: 0
            }
        ).format(number) + " ₽";

    }


</script>


</body>

</html>
