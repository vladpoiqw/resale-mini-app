<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resale Profit</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 18px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: var(--tg-theme-bg-color, #0f0f10);
            color: var(--tg-theme-text-color, #ffffff);
        }

        .header {
            margin: 8px 0 24px;
        }

        .logo {
            font-size: 13px;
            letter-spacing: 1px;
            opacity: .45;
            margin-bottom: 8px;
        }

        h1 {
            margin: 0;
            font-size: 30px;
        }

        .subtitle {
            margin-top: 8px;
            font-size: 14px;
            opacity: .55;
        }

        .card,
        .result {
            background: var(--tg-theme-secondary-bg-color, #19191b);
            border-radius: 22px;
            padding: 20px;
        }

        .field {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            opacity: .55;
        }

        input {
            width: 100%;
            height: 52px;
            padding: 0 15px;
            border: 0;
            outline: 0;
            border-radius: 14px;
            background: var(--tg-theme-bg-color, #101011);
            color: var(--tg-theme-text-color, #fff);
            font-size: 17px;
        }

        button {
            width: 100%;
            height: 54px;
            border: 0;
            border-radius: 15px;
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #fff);
            font-size: 16px;
            font-weight: 600;
        }

        .save {
            margin-top: 12px;
            background: transparent;
            border: 1px solid rgba(128,128,128,.35);
        }

        .result {
            display: none;
            margin-top: 18px;
        }

        .result-title {
            font-size: 13px;
            opacity: .5;
        }

        .profit {
            font-size: 36px;
            font-weight: 700;
            margin: 6px 0 18px;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat {
            padding: 14px;
            border-radius: 15px;
            background: var(--tg-theme-bg-color, #101011);
        }

        .stat-name {
            font-size: 12px;
            opacity: .5;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 600;
        }

        #message {
            text-align: center;
            margin-top: 12px;
            font-size: 13px;
            opacity: .7;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 11px;
            opacity: .3;
        }
    </style>
</head>

<body>

<div class="header">

    <div class="logo">RESALE TOOLS</div>

    <h1>Прибыль</h1>

    <div class="subtitle" id="subtitle">
        Рассчитай доходность сделки
    </div>

</div>


<div class="card">

    <div class="field">
        <label>Цена покупки</label>

        <input
            id="buy"
            type="number"
            inputmode="decimal"
            placeholder="0 ₽"
        >
    </div>


    <div class="field">
        <label>Цена продажи</label>

        <input
            id="sell"
            type="number"
            inputmode="decimal"
            placeholder="0 ₽"
        >
    </div>


    <div class="field">
        <label>Комиссия и расходы</label>

        <input
            id="expenses"
            type="number"
            inputmode="decimal"
            placeholder="0 ₽"
            value="0"
        >
    </div>


    <button id="calculateButton">
        Рассчитать
    </button>

</div>


<div class="result" id="result">

    <div class="result-title">
        Чистая прибыль
    </div>

    <div class="profit" id="profit">
        0 ₽
    </div>


    <div class="stats">

        <div class="stat">
            <div class="stat-name">Маржа</div>
            <div class="stat-value" id="margin">0%</div>
        </div>

        <div class="stat">
            <div class="stat-name">ROI</div>
            <div class="stat-value" id="roi">0%</div>
        </div>

    </div>


    <button class="save" id="saveButton">
        💾 Сохранить сделку
    </button>

</div>


<div id="message"></div>


<div class="footer">
    Resale Profit · v1.0
</div>

</div>

<div id="dealsScreen" style="display:none;">

    <div class="header">
        <div class="logo">RESALE TOOLS</div>
        <h1>Мои сделки</h1>
        <div class="subtitle">
            Твоя статистика
        </div>
    </div>

    <div class="card">

        <div class="stat-name">
            Всего сделок
        </div>

        <div
            id="dealsCount"
            style="font-size:32px;font-weight:700;margin-bottom:20px;"
        >
            0
        </div>

        <div class="stat-name">
            Общая прибыль
        </div>

        <div
            id="totalProfit"
            style="font-size:32px;font-weight:700;"
        >
            0 ₽
        </div>
<div id="dealsList"></div>
    </div>

</div>


<div id="profileScreen" style="display:none;">

    <div class="header">
        <div class="logo">RESALE TOOLS</div>
        <h1>Профиль</h1>
    </div>

    <div class="card">

        <div
            id="profileName"
            style="font-size:25px;font-weight:700;"
        >
            Пользователь
        </div>

        <div
            id="profileId"
            class="subtitle"
        ></div>

    </div>

</div>


<div
    style="
        position:fixed;
        bottom:0;
        left:0;
        right:0;
        height:70px;
        display:flex;
        background:var(--tg-theme-secondary-bg-color,#19191b);
        border-top:1px solid rgba(128,128,128,.15);
    "
>

    <button
        onclick="showScreen('calculatorScreen')"
        style="
            flex:1;
            background:transparent;
            color:inherit;
            border:0;
        "
    >
        🧮<br>
        Калькулятор
    </button>

    <button
        onclick="showScreen('dealsScreen')"
        style="
            flex:1;
            background:transparent;
            color:inherit;
            border:0;
        "
    >
        📊<br>
        Мои сделки
    </button>

    <button
        onclick="showScreen('profileScreen')"
        style="
            flex:1;
            background:transparent;
            color:inherit;
            border:0;
        "
    >
        👤<br>
        Профиль
    </button>

</div>
<script>

    // =========================
    // SUPABASE
    // =========================

    const SUPABASE_URL =
        "https://msqszglpcbutxeciaoma.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_khm1gzHsh9AihyYrA7k63w_CiBsNc0B";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    // =========================
    // TELEGRAM
    // =========================

let tg = null;

if (window.Telegram && window.Telegram.WebApp) {
    tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();
}


    const user =
    tg?.initDataUnsafe?.user;


    if (user) {

        document.getElementById(
            "subtitle"
        ).innerText =
            "Привет, " +
            user.first_name +
            "!";

    }


    // =========================
    // ТЕКУЩАЯ СДЕЛКА
    // =========================

    let currentDeal = null;


    // =========================
    // РАСЧЁТ
    // =========================

    document
        .getElementById("calculateButton")
        .addEventListener("click", function () {

            const buy =
                Number(
                    document.getElementById("buy").value
                );

            const sell =
                Number(
                    document.getElementById("sell").value
                );

            const expenses =
                Number(
                    document.getElementById("expenses").value
                ) || 0;


            if (buy <= 0 || sell <= 0) {

                tg.showAlert(
                    "Укажи цену покупки и продажи"
                );

                return;
            }


            const profit =
                sell - buy - expenses;


            const margin =
                (profit / sell) * 100;


            const roi =
                (profit / buy) * 100;


            currentDeal = {
                buy_price: buy,
                sell_price: sell,
                expenses: expenses,
                profit: profit
            };


            document.getElementById("profit").innerText =
                money(profit);


            document.getElementById("margin").innerText =
                margin.toFixed(1) + "%";


            document.getElementById("roi").innerText =
                roi.toFixed(1) + "%";


            document.getElementById("result").style.display =
                "block";


            document.getElementById("message").innerText =
                "";

        });


    // =========================
    // СОХРАНЕНИЕ
    // =========================

    document
        .getElementById("saveButton")
        .addEventListener("click", async function () {

            const message =
                document.getElementById("message");


            if (!currentDeal) {

                message.innerText =
                    "Сначала рассчитай сделку";

                return;
            }


            if (!user) {

                message.innerText =
                    "Не удалось определить Telegram-пользователя";

                return;
            }


            message.innerText =
                "Сохраняем...";


            const { error } =
                await supabaseClient
                    .from("deals")
                    .insert({

                        user_id:
                            String(user.id),

                        buy_price:
                            currentDeal.buy_price,

                        sell_price:
                            currentDeal.sell_price,

                        expenses:
                            currentDeal.expenses,

                        profit:
                            currentDeal.profit

                    });


            if (error) {

                console.error(error);

                message.innerText =
                    "Ошибка: " + error.message;

                return;
            }


            message.innerText =
                "✅ Сделка сохранена";

        });


    // =========================
    // ФОРМАТ ДЕНЕГ
    // =========================

    function money(number) {

        return new Intl.NumberFormat(
            "ru-RU",
            {
                maximumFractionDigits: 0
            }
        ).format(number) + " ₽";

    }
function showScreen(screenId) {

    document.getElementById("calculatorScreen").style.display = "none";
    document.getElementById("dealsScreen").style.display = "none";
    document.getElementById("profileScreen").style.display = "none";

    document.getElementById(screenId).style.display = "block";

if (screenId === "dealsScreen") {

    loadDeals();

}
    if (screenId === "profileScreen" && user) {

        document.getElementById("profileName").innerText =
            user.first_name;

        document.getElementById("profileId").innerText =
            "Telegram ID: " + user.id;

    }

}
async function loadDeals() {

    const { data, error } = await supabaseClient
        .from("deals")
        .select("*")
        .order("created_at", { ascending: false });


    if (error) {

        console.error("Ошибка загрузки:", error);

        document.getElementById("dealsCount").innerText =
            "Ошибка";
renderDeals(data);
        document.getElementById("totalProfit").innerText =
            error.message;

        return;
    }
function renderDeals(data) {

    const list = document.getElementById("dealsList");

    list.innerHTML = "";

    if (!data || data.length === 0) {

        list.innerHTML = `
            <div class="card" style="margin-top:15px;">
                Пока нет сделок
            </div>
        `;

        return;
    }

    data.forEach(function(deal) {

        const card = document.createElement("div");

        card.className = "card";

        card.style.marginTop = "15px";

        card.innerHTML = `

            <div style="
                font-size:26px;
                font-weight:700;
                margin-bottom:14px;
            ">
                ${money(Number(deal.profit || 0))}
            </div>

            <div class="stat-name">
                Покупка
            </div>

            <div style="margin-bottom:10px;">
                ${money(Number(deal.buy_price || 0))}
            </div>

            <div class="stat-name">
                Продажа
            </div>

            <div style="margin-bottom:10px;">
                ${money(Number(deal.sell_price || 0))}
            </div>

            <div class="stat-name">
                Расходы
            </div>

            <div>
                ${money(Number(deal.expenses || 0))}
            </div>

        `;

        list.appendChild(card);

    });

}

    const dealsCount =
        document.getElementById("dealsCount");

    const totalProfit =
        document.getElementById("totalProfit");


    dealsCount.innerText =
        data.length;


    const total =
        data.reduce(
            (sum, deal) =>
                sum + Number(deal.profit || 0),
            0
        );


    totalProfit.innerText =
        money(total);

}
</script>
</body>
    <div id="calculatorScreen">
</html>
